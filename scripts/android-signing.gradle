import groovy.json.JsonSlurper

def signingProperties = new Properties()
def defaultPropertiesFile = new File(
    System.getProperty("user.home"),
    ".config/drivio/android-signing.properties"
)
def propertiesFile = System.getenv("DRIVIO_SIGNING_PROPERTIES")
    ? new File(System.getenv("DRIVIO_SIGNING_PROPERTIES"))
    : defaultPropertiesFile

if (propertiesFile.exists()) {
    propertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    environmentValue?.trim() ? environmentValue : signingProperties.getProperty(propertyName)
}

def releaseStoreFile = signingValue("DRIVIO_KEYSTORE_PATH", "storeFile")
def releaseStorePassword = signingValue("DRIVIO_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingValue("DRIVIO_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingValue("DRIVIO_KEY_PASSWORD", "keyPassword")
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

gradle.beforeProject { project ->
    if (project.path != ":app") {
        return
    }

    project.afterEvaluate {
        def packageFile = new File(project.rootDir.parentFile, "package.json")
        def appVersion = new JsonSlurper().parse(packageFile).version as String
        def versionParts = appVersion.tokenize(".").collect { it as int }

        if (versionParts.size() != 3 || versionParts.any { it < 0 || it > 99 }) {
            throw new GradleException(
                "La version ${appVersion} doit respecter major.minor.patch avec des valeurs entre 0 et 99."
            )
        }

        project.android.defaultConfig.versionName = appVersion
        project.android.defaultConfig.versionCode =
            versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

        def signingValues = [
            releaseStoreFile,
            releaseStorePassword,
            releaseKeyAlias,
            releaseKeyPassword,
        ]

        if (signingValues.every { it?.trim() }) {
            def releaseSigning = project.android.signingConfigs.findByName("drivioRelease")
                ?: project.android.signingConfigs.create("drivioRelease")
            releaseSigning.storeFile = project.file(releaseStoreFile)
            releaseSigning.storePassword = releaseStorePassword
            releaseSigning.keyAlias = releaseKeyAlias
            releaseSigning.keyPassword = releaseKeyPassword
            project.android.buildTypes.release.signingConfig = releaseSigning
        } else if (releaseRequested) {
            throw new GradleException(
                "Signature Drivio absente. Lancez npm run mobile:signing:setup ou configurez " +
                "DRIVIO_KEYSTORE_PATH, DRIVIO_STORE_PASSWORD, DRIVIO_KEY_ALIAS et DRIVIO_KEY_PASSWORD."
            )
        }
    }
}
